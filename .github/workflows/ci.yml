name: CI Pipeline

# Trigger CI on pushes to main, all PRs, and manual workflow dispatch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

# Prevent concurrent runs on the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Format validation and basic checks
  format-validate:
    name: Format & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Check code formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted:"
            gofmt -s -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Verify dependencies
        run: |
          go mod verify
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "go.mod or go.sum is not tidy"
            git diff go.mod go.sum
            exit 1
          fi

  # Job 2: Linting with golangci-lint
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: format-validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m --config=.golangci.yml

  # Job 3: Multi-platform build matrix
  build:
    name: Build (${{ matrix.os }} / Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    needs: format-validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.22', '1.23']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Build application
        run: go build -v -o renderer ./cmd/renderer

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: renderer-${{ matrix.os }}-go${{ matrix.go-version }}
          path: |
            renderer
            renderer.exe
          if-no-files-found: ignore
          retention-days: 7

  # Job 4: Comprehensive testing with coverage
  test:
    name: Test (${{ matrix.os }} / Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    needs: format-validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.22', '1.23']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Run tests with race detector
        run: go test -race -v ./...

      - name: Run tests with coverage (Linux/Go 1.23 only)
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.23'
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out

      - name: Check coverage thresholds (Linux/Go 1.23 only)
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.23'
        run: |
          # Extract overall coverage percentage
          OVERALL_COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Overall coverage: ${OVERALL_COVERAGE}%"

          # Check overall coverage threshold (70%)
          if (( $(echo "$OVERALL_COVERAGE < 70" | bc -l) )); then
            echo "ERROR: Overall coverage ${OVERALL_COVERAGE}% is below 70% threshold"
            exit 1
          fi

          # Extract math package coverage percentage
          MATH_COVERAGE=$(go tool cover -func=coverage.out | grep "pkg/math" | awk '{sum+=$3; count++} END {if(count>0) print sum/count; else print 0}')
          echo "Math package coverage: ${MATH_COVERAGE}%"

          # Check math package coverage threshold (90%)
          if (( $(echo "$MATH_COVERAGE < 90" | bc -l) )); then
            echo "ERROR: Math package coverage ${MATH_COVERAGE}% is below 90% threshold"
            exit 1
          fi

          echo "✅ Coverage thresholds met!"

      - name: Upload coverage to artifact (Linux/Go 1.23 only)
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.23'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 30

      # Optional: Upload to Codecov (uncomment when ready to integrate)
      # - name: Upload coverage to Codecov
      #   if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.23'
      #   uses: codecov/codecov-action@v4
      #   with:
      #     file: ./coverage.out
      #     flags: unittests
      #     name: codecov-umbrella
      #     fail_ci_if_error: false

  # Job 5: Security scanning with govulncheck
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: format-validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  # Job 6: Final status check (all jobs must pass)
  ci-success:
    name: CI Pipeline Success
    runs-on: ubuntu-latest
    needs: [format-validate, lint, build, test, security]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.format-validate.result }}" != "success" ]] || \
             [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "✅ All CI jobs passed successfully!"
