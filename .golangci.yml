# golangci-lint configuration for go_toy_renderer
# A learning project focused on 3D software rendering

run:
  # Timeout for analysis
  timeout: 5m

  # Include test files in linting
  tests: true

  # Which dirs to skip: issues from them won't be reported
  skip-dirs:
    - vendor
    - .github

  # Enable all available linters, then disable specific ones
  # This ensures we get maximum benefit from static analysis
  enable-all: false

linters:
  enable:
    # Default linters
    - errcheck      # Check for unchecked errors
    - gosimple      # Suggest code simplifications
    - govet         # Reports suspicious constructs
    - ineffassign   # Detect ineffectual assignments
    - staticcheck   # Go static analysis with many checks
    - unused        # Check for unused constants, variables, functions

    # Additional important linters
    - gofmt         # Check code formatting
    - goimports     # Check import formatting
    - misspell      # Detect commonly misspelled English words
    - revive        # Fast, configurable, extensible, flexible linter
    - gosec         # Security-focused linter
    - bodyclose     # Check HTTP response body is closed
    - dupl          # Code clone detection
    - exhaustive    # Check exhaustiveness of enum switch statements
    - goconst       # Find repeated strings that could be constants
    - gocritic      # Comprehensive Go source code linter
    - gocyclo       # Cyclomatic complexity analysis
    - godot         # Check comments end in period
    - goprintffuncname # Check printf-like function names
    - nolintlint    # Ill-formed or insufficient nolint directives
    - prealloc      # Find slice declarations that could be preallocated
    - predeclared   # Find code that shadows predeclared identifiers
    - unconvert     # Remove unnecessary type conversions
    - whitespace    # Detect leading/trailing whitespace
    - exportloopref # Detect pointers to enclosing loop variables
    - gocognit      # Cognitive complexity analysis
    - nestif        # Report deeply nested if statements
    - nakedret      # Find naked returns in functions
    - nilnil        # Check there is no simultaneous return of nil error and nil value
    - nilerr        # Find code returning nil even if it checks that error is not nil
    - errorlint     # Find code that will cause problems with Go 1.13+ error wrapping
    - forbidigo     # Forbid specific identifiers
    - forcetypeassert # Find forced type assertions
    - gomoddirectives # Manage use of replace, retract, excludes in go.mod
    - gomodguard    # Check for blocked dependencies
    - importas      # Enforce consistent import aliases
    - makezero      # Find slice declarations with non-zero initial length
    - promlinter    # Check Prometheus metrics naming
    - thelper       # Detect test helpers without t.Helper()
    - tparallel     # Detect inappropriate usage of t.Parallel()
    - wastedassign  # Find wasted assignment statements
    - wrapcheck     # Check error wrapping

    # Code quality and style
    - stylecheck    # Replacement for golint
    - gofumpt       # Stricter gofmt

  disable:
    # Disable linters that are too strict for a learning project
    - funlen        # Too strict on function length for learning code
    - lll           # Line length can be flexible
    - gochecknoglobals # Globals sometimes useful for learning
    - gochecknoinits # Init functions acceptable in Go
    - exhaustruct   # Too strict for small project
    - varnamelen    # Variable name length too opinionated
    - ireturn       # Interface returns acceptable
    - wsl           # Whitespace linter too opinionated
    - nlreturn      # Too strict on newlines
    - testpackage   # Allow tests in same package for learning
    - paralleltest  # Not all tests need parallelization
    - maintidx      # Maintainability index less relevant for learning
    - cyclop        # Using gocyclo instead
    - depguard      # Dependency restrictions not needed yet
    - tagliatelle   # Struct tag format not critical
    - interfacebloat # Interface size not a concern yet
    - nonamedreturns # Named returns can be educational

linters-settings:
  # Cyclomatic complexity threshold
  gocyclo:
    min-complexity: 15  # Reasonable for learning project

  # Cognitive complexity threshold
  gocognit:
    min-complexity: 20  # Allow some complexity for algorithms

  # Nesting depth threshold
  nestif:
    min-complexity: 5

  # Gocritic settings
  gocritic:
    enabled-checks:
      - ruleguard
    disabled-checks:
      - commentFormatting  # Too strict for learning
      - whyNoLint          # Optional why comments

  # Errcheck settings
  errcheck:
    check-type-assertions: true
    check-blank: false  # Allow _ = assignments for learning

  # Revive settings
  revive:
    severity: warning
    confidence: 0.8
    rules:
      - name: exported
        severity: warning
        disabled: false
        arguments:
          - "checkPrivateReceivers"
          - "sayRepetitiveInsteadOfStutters"

  # Gosec settings (security)
  gosec:
    severity: medium
    confidence: medium
    excludes:
      - G104  # Audit errors not checked (errcheck handles this)

  # Govet settings
  govet:
    check-shadowing: true
    enable-all: true

  # Staticcheck settings
  staticcheck:
    checks: ["all"]

  # Stylecheck settings
  stylecheck:
    checks: ["all", "-ST1000", "-ST1003"]  # Disable package comment requirements
    dot-import-whitelist: []
    http-status-code-whitelist: []

  # Misspell settings
  misspell:
    locale: US
    ignore-words: []

  # Unused settings
  unused:
    check-exported: false  # Don't require all exports to be used

  # Nolintlint settings
  nolintlint:
    allow-leading-space: true
    allow-unused: false
    require-explanation: true
    require-specific: true

issues:
  # Maximum issues count per one linter
  max-issues-per-linter: 0

  # Maximum count of issues with the same text
  max-same-issues: 0

  # Exclude some linters from running on tests files
  exclude-rules:
    # Exclude some linters from test files
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec
        - goconst
        - funlen
        - gocritic

    # Exclude known issues in generated code
    - path: pkg/math/
      text: "cognitive complexity"
      linters:
        - gocognit

    # Allow dot imports in tests for convenience
    - path: _test\.go
      text: "should not use dot imports"
      linters:
        - stylecheck

  # Show all issues from a linter
  exclude-use-default: false

  # Fix found issues (if supported by linter)
  fix: false

output:
  # Format for output
  format: colored-line-number

  # Print lines of code with issue
  print-issued-lines: true

  # Print linter name in the end of issue text
  print-linter-name: true

  # Make issues output unique by line
  uniq-by-line: true

  # Sort results by: filepath, line, and column
  sort-results: true
