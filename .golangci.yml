version: "2"
run:
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  enable:
    - bodyclose
    - copyloopvar
    - dupl
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosec
    - importas
    - makezero
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - nolintlint
    - prealloc
    - predeclared
    - promlinter
    - revive
    - staticcheck
    - thelper
    - tparallel
    - unconvert
    - wastedassign
    - whitespace
    - wrapcheck
  disable:
    - cyclop
    - depguard
    - exhaustruct
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - interfacebloat
    - ireturn
    - lll
    - maintidx
    - nlreturn
    - nonamedreturns
    - paralleltest
    - tagliatelle
    - testpackage
    - varnamelen
    - wsl
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    gocognit:
      min-complexity: 20
    gocritic:
      enabled-checks:
        - ruleguard
      disabled-checks:
        - commentFormatting
        - whyNoLint
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G104
      severity: medium
      confidence: medium
    govet:
      enable:
        - shadow
      settings:
        shadow:
          strict: true
    misspell:
      locale: US
    nestif:
      min-complexity: 5
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    revive:
      confidence: 0.8
      severity: warning
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - sayRepetitiveInsteadOfStutters
          severity: warning
          disabled: false
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
  exclusions:
    generated: lax
    rules:
      - linters:
          - dupl
          - errcheck
          - funlen
          - goconst
          - gocritic
          - gocyclo
          - gosec
        path: _test\.go
      - linters:
          - gosec
        path: pkg/gpu/pack\.go
        text: "G115"
      - linters:
          - gocognit
        path: pkg/math/
        text: cognitive complexity
      - linters:
          - staticcheck
        path: _test\.go
        text: should not use dot imports
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: false
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
